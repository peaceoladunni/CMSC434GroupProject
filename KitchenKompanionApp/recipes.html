
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kitchen Kompanion | Recipes</title>

    <link rel="stylesheet" href="recipes.css">
</head>

<body>
    <div class="device">

    <header>
        <h1>Kitchen<br>Kompanion</h1>
        <h2>Recipes</h2>
        <p>What are we cooking today?</p>
    </header>

    <main>

        <div id="recipes-home">

            <section class="search-section">
                <input
                    type="text"
                    id="search"
                    placeholder="Search recipes..."
                >
            </section>

            <div class="filters-row">
    <section class="filters">
        <button type="button" class="active"
                onclick="showRecipes('all')">
            All
        </button>

        <button type="button"
                onclick="showRecipes('quick')">
            Quick
        </button>

        <button type="button"
                onclick="showRecipes('favorites')">
            Favorites
        </button>
    </section>

    <button
        type="button"
        id="filters-toggle"
        class="filters-toggle"
        aria-expanded="false"
        aria-controls="diet-panel"
        onclick="toggleDietPanel()">
        Filters
    </button>
</div>

<section id="diet-panel" class="diet-filters" hidden
         aria-label="Dietary filters">

    <label>
        <input type="checkbox" id="vegetarian-filter">
        Vegetarian
    </label>

    <label>
        <input type="checkbox" id="gluten-free-filter">
        Gluten-free
    </label>

    <div class="filter-actions">
        <button type="button" onclick="clearDietFilters()">
            Clear filters
        </button>

        <button type="button" onclick="applyDietFilters()">
            Apply filters
        </button>
    </div>
</section>

            <section class="recipes-section">
                <h2>Recommended Recipes</h2>

                <div id="recipe-list">
                </div>
            </section>

            <section class="ingredients-section">
                <h2>Use Your Ingredients</h2>
                <p>Discover recipes using what you already have.</p>

                <div id="ingredient-recipes"></div>
            </section>

        </div>

        <section id="recipe-details" hidden>

            <button type="button" onclick="goBack()">
                ← Back
            </button>

            <h2 id="recipe-title"></h2>

            <img id="recipe-image" alt="Recipe">

            <p id="recipe-time"></p>

            <h3>Ingredients</h3>
            <ul id="ingredients-list"></ul>

            <h3>Instructions</h3>
            <ol id="recipe-steps"></ol>

        </section>

    </main>

    <footer class="bottom-nav">

        <a href="home.html" class="nav-item">
            <i data-lucide="house"></i>
            <span>Kitchen</span>
        </a>

        <a href="shopping_list.html" class="nav-item">
            <i data-lucide="shopping-cart"></i>
            <span>List</span>
        </a>

        <a href="recipes.html" class="nav-item active">
            <i data-lucide="chef-hat"></i>
            <span>Recipes</span>
        </a>

        <a href="#" class="nav-item">
            <i data-lucide="user-round"></i>
            <span>Account</span>
        </a>
    
    </footer>
    </div>

    <script src="recipesData.js"></script>
    <script src="recipes.js"></script>
    <script src="./lucide.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
