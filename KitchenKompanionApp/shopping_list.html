<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Kompanion - Shopping List</title>
  <link rel="stylesheet" href="shopping_list.css">
</head>


<body>
    <div class="app">
<div class="content">
  <header>
    <h1>Kitchen<br>Kompanion</h1>
    <h2>Shopping List</h2>
  </header>


  <main>
      <ul id="shopping-list" class="shopping-list"></ul>
      <p id="shopping-empty" class="empty-message" hidden>No items in shopping list.</p>

<a onclick="openPopup()" class="add-item-btn">Add to Shopping List</a>
    <dialog id="shoplistadd">
        <div class="popup-content">
            <h2>Add to Shopping List</h2>
            <p>Item Name & Quantity</p>
            <form id="addItem" onsubmit="newElement(event)">
                <input id="itemname" type="text" placeholder="Item name" required>
                <input id="itemqty" class="input" type="number" min="1" value="1" placeholder="Quantity" required>
                
                <div class="form-actions">
                    <button type="button" onclick="closePopup()" class="btn">Cancel</button>
                    <button type="submit" class="add-item-btn">Add Item</button>
                </div>
            </form>
        </div>
    </dialog>
  </main>
  </div>


    <footer class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i data-lucide="house"></i>
            <span>Kitchen</span>
        </a>

        <a href="shopping_list.html" class="nav-item active">
            <i data-lucide="shopping-cart"></i>
            <span>List</span>
        </a>

        <a href="recipes.html" class="nav-item">
            <i data-lucide="chef-hat"></i>
            <span>Recipes</span>
        </a>

        <a href="#" class="nav-item">
            <i data-lucide="user-round"></i>
            <span>Account</span>
        </a>
    </footer>
    </div>

    <script src="./lucide.js"></script>
    <script> lucide.createIcons(); </script>
    <script src="shopping_list.js"></script>
    
</body>
</html>
